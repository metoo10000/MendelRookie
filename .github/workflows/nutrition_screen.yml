name: nutrition-blind-screen

on:
  push:
    branches:
      - analysis/nutrition-blind-screen-20260905
    paths:
      - 'nutrition_screen/**'
      - '.github/workflows/nutrition_screen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen-c-n06:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install Python dependencies
        run: pip install pandas numpy requests pyreadstat
      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("survey","jsonlite"), repos="https://cloud.r-project.org")'
      - name: Build participant-level cohort from official NHANES files
        run: python nutrition_screen/prepare_c_n06.py
      - name: Run survey-weighted crude, adjusted, spline, missingness and sensitivity models
        run: Rscript nutrition_screen/analyze_c_n06.R
      - name: Upload complete audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blind-nutrition-screen-c-n06
          path: nutrition_screen/output_c_n06/
          if-no-files-found: warn
