name: nutrition-blind-screen

on:
  push:
    branches:
      - analysis/nutrition-blind-screen-20260905
    paths:
      - 'nutrition_stage/**'
      - '.github/workflows/nutrition_screen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen-c-n08:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install Python dependencies
        run: pip install pandas numpy requests pyreadstat
      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("survey","jsonlite","survival"), repos="https://cloud.r-project.org")'
      - name: Build participant-level cohort from official NHANES and linked mortality files
        run: python nutrition_stage/prepare_c_n08.py
      - name: Run survey-weighted Cox, 5-year risk, spline, missingness and sensitivity models
        run: Rscript nutrition_stage/analyze_c_n08.R
      - name: Upload complete audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blind-nutrition-screen-c-n08
          path: nutrition_stage/output_c_n08/
          if-no-files-found: warn
