name: nutrition-c-n16

on:
  push:
    branches:
      - analysis/nutrition-blind-screen-20260905
    paths:
      - 'nutrition_stage/prepare_c_n16.py'
      - 'nutrition_stage/analyze_c_n16.R'
      - '.github/workflows/nutrition_c_n16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/nutrition-blind-screen-20260905
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install Python dependencies
        run: pip install pandas numpy requests
      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("survey","jsonlite"), repos="https://cloud.r-project.org")'
      - name: Build actual analytic cohort
        run: python nutrition_stage/prepare_c_n16.py
      - name: Run crude, adjusted, nonlinear and sensitivity models
        run: Rscript nutrition_stage/analyze_c_n16.R
      - name: Commit aggregate audit outputs
        if: always()
        run: |
          git config user.name "nutrition-screen-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin analysis/nutrition-blind-screen-20260905 || true
          git add nutrition_stage/output_c_n16 || true
          if ! git diff --cached --quiet; then
            git commit -m "Store blinded C-N16 aggregate screening results"
            git push origin HEAD:analysis/nutrition-blind-screen-20260905
          fi
      - name: Upload aggregate audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-c-n16-results
          path: nutrition_stage/output_c_n16/
          if-no-files-found: warn
